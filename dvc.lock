    params:
      params.yaml:
        collect:
          version: v1
          n_rows: 3000
          sources:
            v1:
            - pavelfedortsov/russian-colloquial-sft-50k
            v2:
            - pavelfedortsov/russian-colloquial-sft-50k
          topics:
          verify_answer_index: true
          system_prompts:
          - Ты отвечаешь на русскоязычные тестовые вопросы НМО. Дан вопрос и 
            варианты ответа с нумерацией с 0. Выбери один правильный вариант. 
            Ответь только номером варианта и текстом ответа, без объяснений.
          - Перед тобой тестовый вопрос НМО на русском языке и варианты ответа, 
            пронумерованные с нуля. Выбери единственный верный вариант и выведи 
            его номер и текст. Ничего не объясняй.
          - 'Задача: выбрать один правильный ответ на вопрос НМО. Варианты пронумерованы
            начиная с 0. В ответе — только номер и текст выбранного варианта, без
            рассуждений.'
          - 'Ты помогаешь готовиться к аккредитации НМО. Дан вопрос и пронумерованные
            с 0 варианты ответа. Назови один правильный вариант: сначала номер, затем
            его текст. Пояснений не добавляй.'
          - Отвечай на вопросы НМО по клиническим рекомендациям. Варианты ответа
            пронумерованы с 0, верный ровно один. Выведи номер верного варианта 
            и его текст — и больше ничего.
        paths.raw: data/raw.jsonl
    outs:
